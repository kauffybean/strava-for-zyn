<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynfantry - Front-line Pouchers</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #1a1a1a;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        .slogan {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: #d1d1d1;
        }
        .card {
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .military-accent {
            color: #8a9a5b; /* Olive green */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ZYNFANTRY</h1>
        <p class="slogan">Front-line Pouchers</p>
        
        <div class="card">
            <p>The <span class="military-accent">tactical</span> social tracking app for Zyn consumption</p>
            <p>Coming soon with full tracking, social features, and tactical analytics</p>
        </div>
    </div>
</body>
</html>
